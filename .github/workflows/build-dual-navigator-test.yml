name: Build dual Navigator Voyager test

on:
  workflow_dispatch:
  push:
    branches:
      - test/dual-navigator
    paths:
      - scripts/patch-voyager-dual-hid.py
      - .github/workflows/build-dual-navigator-test.yml

permissions:
  contents: write

env:
  LAYOUT_ID: emVdK
  LAYOUT_GEOMETRY: voyager
  QMK_OPENRGB_REF: module_revD

jobs:
  build-dual-navigator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v5
        with:
          ref: test/dual-navigator
          fetch-depth: 0

      - name: Download latest Oryx layout source
        id: oryx
        run: |
          response=$(curl --fail --silent --show-error --location 'https://oryx.zsa.io/graphql' \
            --header 'Content-Type: application/json' \
            --data '{"query":"query getLayout($hashId: String!, $revisionId: String!, $geometry: String) {layout(hashId: $hashId, geometry: $geometry, revisionId: $revisionId) { revision { hashId, qmkVersion, title }}}","variables":{"hashId":"'"${LAYOUT_ID}"'","geometry":"'"${LAYOUT_GEOMETRY}"'","revisionId":"latest"}}')

          hash_id=$(echo "$response" | jq -r '.data.layout.revision.hashId')
          firmware_version=$(printf '%.0f' "$(echo "$response" | jq -r '.data.layout.revision.qmkVersion')")
          title=$(echo "$response" | jq -r '.data.layout.revision.title')

          test -n "$hash_id"
          test "$hash_id" != "null"
          test -n "$firmware_version"

          echo "Oryx revision: $hash_id"
          echo "Oryx QMK firmware: firmware${firmware_version}"
          echo "Oryx title: $title"

          curl --fail --silent --show-error --location \
            "https://oryx.zsa.io/source/${hash_id}" \
            -o source.zip

          rm -rf "${LAYOUT_ID}"
          mkdir -p "${LAYOUT_ID}"
          unzip -oj source.zip '*_source/*' -d "${LAYOUT_ID}"
          rm source.zip

          echo "hash_id=${hash_id}" >> "$GITHUB_OUTPUT"
          echo "firmware_version=${firmware_version}" >> "$GITHUB_OUTPUT"

      - name: Add dual Navigator and OpenRGB test configuration
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          layout = Path("emVdK")

          keymap_json = layout / "keymap.json"
          data = json.loads(keymap_json.read_text())
          modules = data.setdefault("modules", [])
          for module in (
              "zsa/oryx",
              "zsa/navigator_trackball",
              "zsa/navigator_trackpad",
              "zsa/automouse",
              "zsa/defaults",
              "openrgb",
          ):
              if module not in modules:
                  modules.append(module)
          keymap_json.write_text(json.dumps(data, indent=4) + "\n")

          config = layout / "config.h"
          text = config.read_text()
          for name, value in (
              ("NAVIGATOR_TRACKBALL_ROTATION", "325"),
              ("NAVIGATOR_TRACKPAD_ROTATION", "0"),
          ):
              pattern = rf"^#define\s+{name}\s+.*$"
              replacement = f"#define {name} {value}"
              if re.search(pattern, text, flags=re.MULTILINE):
                  text = re.sub(pattern, replacement, text, flags=re.MULTILINE)
              else:
                  text += f"\n{replacement}\n"
          config.write_text(text)

          rules = layout / "rules.mk"
          text = rules.read_text()
          pattern = r"^MOUSE_SHARED_EP\s*=.*$"
          if re.search(pattern, text, flags=re.MULTILINE):
              text = re.sub(pattern, "MOUSE_SHARED_EP = yes", text, flags=re.MULTILINE)
          else:
              if text and not text.endswith("\n"):
                  text += "\n"
              text += "MOUSE_SHARED_EP = yes\n"
          rules.write_text(text)
          PY

      - name: Save refreshed test source on branch
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "github-actions@github.com"
          git add "${LAYOUT_ID}"
          if ! git diff --cached --quiet; then
            git commit -m "Refresh dual Navigator test source from Oryx"
            git push origin HEAD:test/dual-navigator
          else
            echo "Oryx source unchanged"
          fi

      - name: Initialize matching ZSA QMK firmware
        run: |
          git submodule update --init --remote --depth=1 --no-single-branch
          cd qmk_firmware
          git checkout -B "firmware${{ steps.oryx.outputs.firmware_version }}" \
            "origin/firmware${{ steps.oryx.outputs.firmware_version }}"
          git submodule update --init --recursive
          cd ..

      - name: Install QMK-OpenRGB module
        run: |
          rm -rf qmk_firmware/modules/openrgb
          git clone \
            --depth 1 \
            --branch "${QMK_OPENRGB_REF}" \
            https://gitlab.com/OpenRGBDevelopers/QMK-OpenRGB.git \
            qmk_firmware/modules/openrgb
          echo "QMK-OpenRGB commit: $(git -C qmk_firmware/modules/openrgb rev-parse HEAD)"

      - name: Apply OpenRGB and Keymapp dual-HID patch
        run: |
          python3 scripts/patch-voyager-dual-hid.py qmk_firmware

      - name: Validate test configuration
        run: |
          grep -q '"zsa/navigator_trackball"' "${LAYOUT_ID}/keymap.json"
          grep -q '"zsa/navigator_trackpad"' "${LAYOUT_ID}/keymap.json"
          grep -q '"openrgb"' "${LAYOUT_ID}/keymap.json"
          grep -q 'NAVIGATOR_TRACKBALL_ROTATION 325' "${LAYOUT_ID}/config.h"
          grep -q 'NAVIGATOR_TRACKPAD_ROTATION 0' "${LAYOUT_ID}/config.h"
          grep -q '^MOUSE_SHARED_EP = yes$' "${LAYOUT_ID}/rules.mk"

          grep -q 'void raw_hid_receive(uint8_t \*data, uint8_t length)' \
            qmk_firmware/modules/openrgb/openrgb.c
          grep -q 'void oryx_hid_receive(uint8_t \*data, uint8_t length)' \
            qmk_firmware/modules/zsa/oryx/oryx.c

      - name: Build QMK Docker image
        run: docker build -t qmk .

      - name: Install layout into QMK tree
        run: |
          rm -rf "qmk_firmware/keyboards/zsa/voyager/keymaps/${LAYOUT_ID}"
          mkdir -p qmk_firmware/keyboards/zsa/voyager/keymaps
          cp -r "${LAYOUT_ID}" qmk_firmware/keyboards/zsa/voyager/keymaps/

      - name: Build Voyager firmware
        run: |
          docker run \
            -v ./qmk_firmware:/root \
            --rm \
            qmk \
            /bin/sh -c "
              qmk setup zsa/qmk_firmware -b firmware${{ steps.oryx.outputs.firmware_version }} -y
              make zsa/voyager:${LAYOUT_ID}
            "

      - name: Show built firmware
        run: |
          find qmk_firmware -maxdepth 1 -type f -name '*voyager*.bin' -ls

      - name: Upload test firmware
        uses: actions/upload-artifact@v7
        with:
          name: voyager_emVdK_openrgb_trackball_right_trackpad_left
          path: qmk_firmware/*voyager*.bin
          if-no-files-found: error
